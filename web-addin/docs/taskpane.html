<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stepwise Regression</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <header class="bar">Stepwise Regression</header>

  <main>
    <section class="field">
      <label for="yRange">Y range (dependent variable)</label>
      <div class="pick">
        <input id="yRange" type="text" spellcheck="false" placeholder="e.g. A4:A48">
        <button type="button" class="secondary" data-pick="yRange">Use selection</button>
      </div>
      <p class="hint">One column. Include the label cell if you have one.</p>
    </section>

    <section class="field">
      <label for="xRange">X range (candidate predictors)</label>
      <div class="pick">
        <input id="xRange" type="text" spellcheck="false" placeholder="e.g. B4:F48">
        <button type="button" class="secondary" data-pick="xRange">Use selection</button>
      </div>
      <p class="hint">Same rows as Y. Ctrl+click (Cmd+click on Mac) to add non-adjacent columns.</p>
    </section>

    <section class="field check">
      <input id="hasLabels" type="checkbox" checked>
      <label for="hasLabels">First row contains labels</label>
    </section>

    <section class="field">
      <label for="method">Method</label>
      <select id="method">
        <option value="1">Forward selection</option>
        <option value="2">Backward elimination</option>
        <option value="3" selected>Stepwise</option>
      </select>
    </section>

    <section class="field">
      <label for="criterion">Criterion</label>
      <select id="criterion">
        <option value="1" selected>T-Stat</option>
        <option value="2">P-value</option>
      </select>
    </section>

    <section class="field two">
      <div>
        <label for="enter" id="enterLabel">|T-Stat| to enter</label>
        <input id="enter" type="number" step="0.01" min="0" value="2">
      </div>
      <div>
        <label for="remove" id="removeLabel">|T-Stat| to remove</label>
        <input id="remove" type="number" step="0.01" min="0" value="2">
      </div>
    </section>

    <button type="button" id="run" class="primary">Run regression</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <footer>
    <a href="support.html" target="_blank" rel="noopener">Help</a>
    <span>HOUMBA Class of '28</span>
  </footer>

  <script src="stepwise.js"></script>
  <script src="report.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
